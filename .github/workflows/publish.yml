name: Publish

# Publishes the seven cross-platform packages.
#
# Broiler.Media.Video.MediaFoundation is deliberately NOT published here. It
# carries a package dependency on Broiler.Graphics.Windows, so it cannot ship
# until that package is on the same feed. The Release-Linux configuration
# excludes it, which is exactly the set that is ready to publish.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which feed to publish to
        type: choice
        options:
          - github
          - nuget
        default: github
      version-suffix:
        description: 'Override VersionSuffix, e.g. preview.2. Leave empty to use eng/Broiler.Packaging.props.'
        type: string
        default: ''
      dry-run:
        description: Pack and upload the artifact, but do not push to the feed
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ github.event_name == 'push' && 'nuget' || inputs.target }}
    runs-on: ubuntu-latest

    env:
      # A tag push is always a real nuget.org release. A manual run chooses,
      # and defaults to a dry run so the workflow is safe to try out.
      TARGET: ${{ github.event_name == 'push' && 'nuget' || inputs.target }}
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry-run }}
      CONFIGURATION: Release-Linux

    steps:
      # Submodules are intentionally NOT checked out. Release-Linux excludes
      # Broiler.Media.Video.MediaFoundation, the only project that reaches into
      # Broiler.Graphics, so publishing stays independent of that repository.
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          suffix='${{ inputs.version-suffix }}'
          if [ -n "$suffix" ]; then
            version_args="-p:VersionSuffix=$suffix"
          else
            version_args=""
          fi

          # eng/Broiler.Packaging.props is the source of truth for the suite
          # version, so ask MSBuild what it will actually stamp rather than
          # reconstructing it here.
          version=$(dotnet msbuild src/Broiler.Media/Broiler.Media.csproj $version_args -getProperty:PackageVersion)
          version=$(echo "$version" | tr -d '[:space:]')

          if [ -z "$version" ]; then
            echo "::error::Could not resolve the package version from MSBuild."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_args=$version_args" >> "$GITHUB_OUTPUT"
          echo "Version: $version -> $TARGET (dry-run: $DRY_RUN)"

      - name: Check the tag matches the packaged version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag '$tag' does not match the packaged version '${{ steps.version.outputs.version }}'. eng/Broiler.Packaging.props is the source of truth for the suite version - update it and commit, or move the tag."
            exit 1
          fi

      - name: Require a NuGet.org API key
        if: env.TARGET == 'nuget' && env.DRY_RUN != 'true'
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::Publishing to nuget.org needs the NUGET_API_KEY repository secret."
            exit 1
          fi

      - name: Build
        run: dotnet build Broiler.Media.slnx -c "$CONFIGURATION" --nologo ${{ steps.version.outputs.version_args }}

      - name: Test
        shell: bash
        run: ./eng/run-tests.sh

      - name: Pack
        run: |
          dotnet pack Broiler.Media.slnx -c "$CONFIGURATION" --nologo \
            ${{ steps.version.outputs.version_args }} -o ./artifacts
          echo "Packed:"
          ls -1 ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      # GitHub Packages does not accept snupkg symbol packages, hence
      # --no-symbols. The feed owner must match the package RepositoryUrl,
      # which SourceLink fills in from this checkout's origin.
      - name: Push to GitHub Packages
        if: env.TARGET == 'github' && env.DRY_RUN != 'true'
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols

      # Pushing a .nupkg also pushes the .snupkg sitting beside it.
      - name: Push to NuGet.org
        if: env.TARGET == 'nuget' && env.DRY_RUN != 'true'
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - name: Summary
        run: |
          {
            echo "### Broiler.Media ${{ steps.version.outputs.version }}"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run - packages were built and attached to this run, nothing was pushed."
            else
              echo "Pushed to \`$TARGET\`."
            fi
            echo
            echo '```'
            ls -1 ./artifacts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
