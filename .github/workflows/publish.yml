name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which feed to publish to
        type: choice
        options:
          - github
          - nuget
        default: github
      dry-run:
        description: Pack and upload the artifact without reserving a version or pushing
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Reserve preview versions with publish/* tags.
  packages: write

# Version allocation is repository-wide, across branches and both feeds.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ github.event_name == 'push' && 'nuget' || inputs.target }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TARGET: ${{ github.event_name == 'push' && 'nuget' || inputs.target }}
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry-run }}
      CONFIGURATION: Release-Windows

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test version allocation
        run: ./eng/test-package-version.ps1

      - name: Resolve version
        id: version
        run: |
          $base = dotnet msbuild src/Broiler.Media/Broiler.Media.csproj -getProperty:PackageVersion
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the repository version.' }
          $arguments = @{ BaseVersion = $base.Trim(); RunId = $env:GITHUB_RUN_ID }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.Tag = $env:GITHUB_REF_NAME }
          $version = ./eng/package-version.ps1 @arguments
          "base=$($base.Trim())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version -> $env:TARGET (dry-run: $env:DRY_RUN)"

      - name: Require a NuGet.org API key
        if: env.TARGET == 'nuget' && env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) { throw 'Publishing to nuget.org needs the NUGET_API_KEY repository secret.' }

      - name: Build
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Broiler.Media.slnx -c $env:CONFIGURATION --nologo "-p:Version=$env:PACKAGE_VERSION"

      - name: Test
        shell: bash
        run: ./eng/run-tests.sh "$CONFIGURATION"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack Broiler.Media.slnx -c $env:CONFIGURATION --no-build --nologo "-p:Version=$env:PACKAGE_VERSION" -o ./artifacts

      - name: Verify packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./eng/verify-packages.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - name: Reserve version
        if: env.DRY_RUN != 'true'
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $arguments = @{
            BaseVersion = $env:BASE_VERSION
            RunId = $env:GITHUB_RUN_ID
            Version = $env:PACKAGE_VERSION
            Reserve = $true
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.Tag = $env:GITHUB_REF_NAME }
          ./eng/package-version.ps1 @arguments

      - name: Push packages
        if: env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:TARGET -eq 'github') {
            $source = "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json"
            $key = $env:GH_PACKAGES_TOKEN
            $extra = @('--no-symbols')
          } else {
            $source = 'https://api.nuget.org/v3/index.json'
            $key = $env:NUGET_API_KEY
            $extra = @()
          }
          # Skip duplicates only to recover a partial push on a rerun of the same reservation.
          # PowerShell does not expand globs for native commands. Pass concrete paths
          # so package discovery does not depend on NuGet's platform-specific glob handling.
          $packages = @(Get-ChildItem -LiteralPath ./artifacts -Filter '*.nupkg' -File | Sort-Object Name)
          if ($packages.Count -eq 0) { throw 'No NuGet packages found in ./artifacts.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source $source --api-key $key --skip-duplicate @extra
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet push failed for $($package.Name) (exit code $LASTEXITCODE)."
            }
          }

      - name: Summary
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "### Broiler.Media $env:PACKAGE_VERSION" >> $env:GITHUB_STEP_SUMMARY
          if ($env:DRY_RUN -eq 'true') {
            'Dry run: verified packages attached; no version reserved or packages pushed.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Published to $env:TARGET. Reservation: publish/$env:PACKAGE_VERSION." >> $env:GITHUB_STEP_SUMMARY
          }
          Get-ChildItem artifacts -Name | ForEach-Object { "- $_" >> $env:GITHUB_STEP_SUMMARY }
