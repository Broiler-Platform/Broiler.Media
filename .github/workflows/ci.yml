name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''
      feed:
        description: Publish destination (github or nuget); selects the restore sources
        type: string
        default: github

permissions:
  contents: read
  packages: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
  FEED: ${{ inputs.feed || 'github' }}
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select restore sources for ${{ inputs.feed || 'github' }}
        run: |
          case "$FEED" in
            github) ;; # The repository NuGet.config: Broiler.* from GitHub Packages, the rest from NuGet.org.
            nuget) cp eng/NuGet.nuget-org.config NuGet.config ;;
            *) echo "::error::Unknown feed '$FEED'; use github or nuget." >&2; exit 1 ;;
          esac
          grep -o 'key="[^"]*" value="[^"]*"' NuGet.config

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.Media.slnx -c Release --nologo "${args[@]}"

      - name: Test
        run: bash ./eng/run-tests.sh Release

      - name: Pack and verify every package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
