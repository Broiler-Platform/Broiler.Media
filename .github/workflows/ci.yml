name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both hosts pack all libraries; Windows also runs the native-backend suite.
          - os: ubuntu-latest
            configuration: Release-Linux
          - os: windows-latest
            configuration: Release-Windows

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Broiler.Media.slnx -c ${{ matrix.configuration }} --nologo

      # The suites are self-hosted console runners, not a test framework, so
      # there is nothing for `dotnet test` to discover. See eng/run-tests.sh.
      - name: Test
        shell: bash
        run: ./eng/run-tests.sh "${{ matrix.configuration }}"

      - name: Test version allocation
        shell: pwsh
        run: ./eng/test-package-version.ps1

      # Proves the packages still build from this commit. Publishing is a
      # separate, deliberate action - see .github/workflows/publish.yml.
      - name: Pack
        run: dotnet pack Broiler.Media.slnx -c ${{ matrix.configuration }} --no-build --nologo -o ./artifacts

      - name: Verify packages
        shell: pwsh
        run: |
          $version = dotnet msbuild src/Broiler.Media/Broiler.Media.csproj -getProperty:PackageVersion
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the repository version.' }
          ./eng/verify-packages.ps1 -Version $version.Trim()

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ matrix.configuration }}
          path: artifacts/*
          if-no-files-found: error
